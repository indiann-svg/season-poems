<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>초등 6학년 사계절 영어 시 자료실</title>
  <style>
    :root {
      --spring-bg: #fff5f7;
      --spring-main: #ff7597;
      --summer-bg: #f0fdf4;
      --summer-main: #10b981;
      --autumn-bg: #fffbe6;
      --autumn-main: #d97706;
      --winter-bg: #f0f9ff;
      --winter-main: #0284c7;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Malgun Gothic', sans-serif; }
    body { background-color: #f8fafc; color: #334155; padding: 20px; }

    header { text-align: center; margin-bottom: 25px; }
    header h1 { color: #1e293b; font-size: 1.8rem; margin-bottom: 8px; }
    header p { color: #64748b; font-size: 0.95rem; }

    /* Category Buttons */
    .category-tabs { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-bottom: 25px; }
    .tab-btn {
      border: 2px solid #e2e8f0; background: white; padding: 10px 18px; border-radius: 20px;
      font-size: 1rem; font-weight: bold; cursor: pointer; transition: all 0.2s;
    }
    .tab-btn.active[data-season="all"] { background: #475569; color: white; border-color: #475569; }
    .tab-btn.active[data-season="spring"] { background: var(--spring-main); color: white; border-color: var(--spring-main); }
    .tab-btn.active[data-season="summer"] { background: var(--summer-main); color: white; border-color: var(--summer-main); }
    .tab-btn.active[data-season="autumn"] { background: var(--autumn-main); color: white; border-color: var(--autumn-main); }
    .tab-btn.active[data-season="winter"] { background: var(--winter-main); color: white; border-color: var(--winter-main); }

    /* Grid Layout */
    .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 18px; max-width: 1100px; margin: 0 auto; }
    .poem-card {
      background: white; border-radius: 16px; padding: 20px; border: 2px solid #f1f5f9;
      cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; text-align: center;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
    }
    .poem-card:hover { transform: translateY(-4px); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
    .poem-card[data-season="spring"] { border-top: 6px solid var(--spring-main); }
    .poem-card[data-season="summer"] { border-top: 6px solid var(--summer-main); }
    .poem-card[data-season="autumn"] { border-top: 6px solid var(--autumn-main); }
    .poem-card[data-season="winter"] { border-top: 6px solid var(--winter-main); }

    .card-icon { font-size: 2.5rem; margin-bottom: 10px; }
    .card-title { font-size: 1.1rem; font-weight: bold; color: #1e293b; margin-bottom: 6px; }
    .card-desc { font-size: 0.85rem; color: #64748b; }

    /* Modal Styles */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5);
      display: none; justify-content: center; align-items: center; z-index: 1000; padding: 15px;
    }
    .modal-content {
      background: white; border-radius: 20px; width: 100%; max-width: 550px; max-height: 90vh;
      overflow-y: auto; padding: 25px; position: relative; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
    }
    .close-btn { position: absolute; top: 15px; right: 20px; font-size: 1.8rem; cursor: pointer; border: none; background: none; color: #94a3b8; }
    
    .modal-header { text-align: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 2px solid #f1f5f9; }
    .modal-header h2 { font-size: 1.4rem; color: #0f172a; margin-top: 5px; }

    .tts-controls { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
    .btn-play { background: #2563eb; color: white; border: none; padding: 8px 16px; border-radius: 20px; font-weight: bold; cursor: pointer; }
    .btn-play:hover { background: #1d4ed8; }

    .poem-lines { display: flex; flex-direction: column; gap: 12px; margin-bottom: 25px; }
    .poem-line { background: #f8fafc; padding: 10px 14px; border-radius: 10px; border-left: 4px solid #cbd5e1; }
    .line-en { font-weight: bold; font-size: 1.05rem; color: #1e293b; margin-bottom: 3px; }
    .line-ko { font-size: 0.9rem; color: #64748b; }

    .vocab-section { background: #f1f5f9; padding: 15px; border-radius: 12px; }
    .vocab-title { font-size: 0.95rem; font-weight: bold; color: #334155; margin-bottom: 8px; }
    .vocab-tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .vocab-tag { background: white; padding: 4px 10px; border-radius: 15px; font-size: 0.85rem; border: 1px solid #e2e8f0; }
  </style>
</head>

        { en: 'It is cold, but I feel happy.', ko: '춥지만 나는 행복해요.' },
        { en: 'Winter is my favorite season.', ko: '겨울은 내가 가장 좋아하는 계절이에요.' }
      ], vocab: ['sled (썰매)', 'slide down (미끄러지다)', 'hill (언덕)', 'cold (추운)'] },

      { season: 'winter', icon: '♨️', title: '김이 모락모락 나는 군고구마', lines: [
        { en: 'Winter, winter.', ko: '겨울, 겨울.' },
        { en: 'Winter is here.', ko: '겨울이 왔어요.' },
        { en: 'I like winter because I can eat hot sweet potatoes.', ko: '나는 따뜻한 군고구마를 먹을 수 있어서 겨울을 좋아해요.' },
        { en: 'They are warm and very sweet.', ko: '따뜻하고 정말 달콤해요.' },
        { en: 'My hands get warm again.', ko: '내 손이 다시 따뜻해져요.' },
        { en: 'Winter is my favorite season.', ko: '겨울은 내가 가장 좋아하는 계절이에요.' }
      ], vocab: ['sweet potato (고구마)', 'warm (따뜻한)', 'hand (손)', 'again (다시)'] },

      { season: 'winter', icon: '❄️', title: '창문에 비친 얼음꽃 정원', lines: [
        { en: 'Winter, winter.', ko: '겨울, 겨울.' },
        { en: 'Winter is here.', ko: '겨울이 왔어요.' },
        { en: 'I like winter because I can see ice flowers on the window.', ko: '나는 창문에 핀 얼음꽃을 볼 수 있어서 겨울을 좋아해요.' },
        { en: 'They shine like little stars.', ko: '작은 별들처럼 반짝여요.' },
        { en: 'The winter morning is bright and clean.', ko: '겨울 아침은 밝고 깨끗해요.' },
        { en: 'Winter is my favorite season.', ko: '겨울은 내가 가장 좋아하는 계절이에요.' }
      ], vocab: ['ice (얼음)', 'window (창문)', 'star (별)', 'morning (아침)'] },

      { season: 'winter', icon: '☕️', title: 'warm 핫초코를 마시는 방안', lines: [
        { en: 'Winter, winter.', ko: '겨울, 겨울.' },
        { en: 'Winter is here.', ko: '겨울이 왔어요.' },
        { en: 'I like winter because I can drink hot chocolate.', ko: '나는 핫초코를 마실 수 있어서 겨울을 좋아해요.' },
        { en: 'I wear my cozy red sweater.', ko: '나는 포근한 빨간 스웨터를 입어요.' },
        { en: 'My home is warm and peaceful.', ko: '우리 집은 따뜻하고 평화로워요.' },
        { en: 'Winter is my favorite season.', ko: '겨울은 내가 가장 좋아하는 계절이에요.' }
      ], vocab: ['drink (마시다)', 'hot chocolate (핫초코)', 'cozy (포근한)', 'peaceful (평화로운)'] }
    ];

    let currentPoem = null;

    // Render Cards
    function renderCards(filterSeason = 'all') {
      const grid = document.getElementById('cardGrid');
      grid.innerHTML = '';

      poemsData.forEach((poem, index) => {
        if (filterSeason !== 'all' && poem.season !== filterSeason) return;

        const card = document.createElement('div');
        card.className = 'poem-card';
        card.setAttribute('data-season', poem.season);
        card.onclick = () => openModal(poem);

        card.innerHTML = `
          <div class="card-icon">${poem.icon}</div>
          <div class="card-title">${poem.title}</div>
          <div class="card-desc">${poem.lines[2].en.substring(0, 32)}...</div>
        `;
        grid.appendChild(card);
      });
    }

    // Filter Buttons
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        renderCards(e.target.getAttribute('data-season'));
      });
    });

    // Modal Handlers
    function openModal(poem) {
      currentPoem = poem;
      document.getElementById('modalIcon').innerText = poem.icon;
      document.getElementById('modalTitle').innerText = poem.title;

      const poemLinesDiv = document.getElementById('poemLines');
      poemLinesDiv.innerHTML = poem.lines.map(line => `
        <div class="poem-line">
          <div class="line-en">${line.en}</div>
          <div class="line-ko">${line.ko}</div>
        </div>
      `).join('');

      const vocabTagsDiv = document.getElementById('vocabTags');
      vocabTagsDiv.innerHTML = poem.vocab.map(v => `
        <span class="vocab-tag">${v}</span>
      `).join('');

      document.getElementById('modalOverlay').style.display = 'flex';
    }

    document.getElementById('closeBtn').onclick = () => {
      document.getElementById('modalOverlay').style.display = 'none';
      window.speechSynthesis.cancel();
    };

    // TTS Function
    document.getElementById('btnPlayAll').onclick = () => {
      if (!currentPoem) return;
      window.speechSynthesis.cancel();

      const fullText = currentPoem.lines.map(l => l.en).join('. ');
      const utterance = new SpeechSynthesisUtterance(fullText);
      utterance.lang = 'en-US';
      utterance.rate = 0.85; // 쉬운 학습을 위해 약간 천천히
      window.speechSynthesis.speak(utterance);
    };

    // Init
    renderCards();
  </script>
</body>
